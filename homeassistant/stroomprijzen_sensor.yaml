# ============================================================================
# Home Assistant: stroomprijzen van vandaag EN morgen als CSV-string
# ============================================================================
# LET OP: dit bestand wordt aangeroepen als
# "template: !include stroomprijzen_sensor.yaml" vanuit configuration.yaml.
# Daarom staat hier GEEN "template:"-regel bovenaan.
#
# BRON: Zonneplan (integratie fsaris/home-assistant-zonneplan-one).
# We gebruiken price_tax_included: de ALL-IN consumentenprijs, inclusief
# inkoopvergoeding, energiebelasting en btw - precies wat Zonneplan factureert.
# Bewust NIET zelf omrekenen vanaf een spotprijs: de opslag is een
# contractvoorwaarde en de energiebelasting wijzigt elk jaar per 1 januari.
# Een handgemaakte formule gaat daardoor stilzwijgend driften.
#
# Het forecast-attribuut bevat kwartierprijzen (96 per dag) over een venster
# van ruwweg een dag terug tot twee dagen vooruit, dus vandaag EN morgen
# zitten er altijd in. amount staat in 1e-7 EUR: 2536993 -> 0,2536993
# EUR/kWh. Vandaar de deling door 10000000.
#
# Per LOKAAL uur middelen: 96 losse kwartierwaarden passen niet binnen de
# HA state-limiet van 255 tekens (de state werd dan stilzwijgend "unknown").
#
# TWEE SENSOREN, elk met een vaste betekenis:
#   sensor.stroomprijzen_vandaag_csv -> ALTIJD vandaag
#   sensor.stroomprijzen_morgen_csv  -> ALTIJD morgen
# Het scherm heeft ze allebei tegelijk nodig; de bovenste zijknop schakelt.
#
# Het attribuut "datum" (dd-mm-jjjj) is belangrijk: de firmware vergelijkt dat
# met zijn eigen berekende datum van morgen. Zijn ze ongelijk, dan toont het
# scherm "Prijzen van morgen nog niet bekend" in plaats van oude cijfers.
#
# DST-kanttekening: we lopen range(24) af. Op de 25-uursdag worden de twee
# uren "2" samengevoegd, op de 23-uursdag ontbreekt uur 2. Cosmetisch.
# ============================================================================

- trigger:
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      hours: "0"
      minutes: "5"
    - trigger: time_pattern
      minutes: "/30"
    # Handmatig verversen: vuur het event stroomprijzen_refresh af
    # (Ontwikkelhulpmiddelen > Gebeurtenissen). Handig na een reload.
    - trigger: event
      event_type: stroomprijzen_refresh
  sensor:
    - name: "Stroomprijzen vandaag CSV"
      unique_id: stroomprijzen_vandaag_csv
      icon: mdi:transmission-tower
      state: >
        {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff','forecast') or [] %}
        {% set target = (now() + timedelta(days=0)).date() %}
        {% set day = namespace(items=[]) %}
        {% for f in fc %}
          {% set d = f.start_date | as_datetime | as_local %}
          {% if d.date() == target %}
            {% set day.items = day.items + [ {'h': d.hour, 'v': f.price_tax_included.amount} ] %}
          {% endif %}
        {% endfor %}
        {% set out = namespace(l=[]) %}
        {% for h in range(24) %}
          {% set vals = day.items | selectattr('h','eq',h) | map(attribute='v') | list %}
          {% if vals | count > 0 %}
            {% set out.l = out.l + [ ((vals|sum)/(vals|count)/10000000) | round(3) ] %}
          {% endif %}
        {% endfor %}
        {{ out.l | join(',') }}
      attributes:
        datum: "{{ (now() + timedelta(days=0)).strftime('%d-%m-%Y') }}"
        aantal_uren: >
          {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff','forecast') or [] %}
          {% set target = (now() + timedelta(days=0)).date() %}
          {% set ns = namespace(h=[]) %}
          {% for f in fc %}
            {% set d = f.start_date | as_datetime | as_local %}
            {% if d.date() == target and d.hour not in ns.h %}
              {% set ns.h = ns.h + [d.hour] %}
            {% endif %}
          {% endfor %}
          {{ ns.h | count }}
        laatst_opgehaald: "{{ now().isoformat() }}"

- trigger:
    - trigger: homeassistant
      event: start
    - trigger: time_pattern
      hours: "0"
      minutes: "5"
    - trigger: time_pattern
      minutes: "/30"
    # Handmatig verversen: vuur het event stroomprijzen_refresh af
    # (Ontwikkelhulpmiddelen > Gebeurtenissen). Handig na een reload.
    - trigger: event
      event_type: stroomprijzen_refresh
  sensor:
    - name: "Stroomprijzen morgen CSV"
      unique_id: stroomprijzen_morgen_csv
      icon: mdi:transmission-tower
      state: >
        {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff','forecast') or [] %}
        {% set target = (now() + timedelta(days=1)).date() %}
        {% set day = namespace(items=[]) %}
        {% for f in fc %}
          {% set d = f.start_date | as_datetime | as_local %}
          {% if d.date() == target %}
            {% set day.items = day.items + [ {'h': d.hour, 'v': f.price_tax_included.amount} ] %}
          {% endif %}
        {% endfor %}
        {% set out = namespace(l=[]) %}
        {% for h in range(24) %}
          {% set vals = day.items | selectattr('h','eq',h) | map(attribute='v') | list %}
          {% if vals | count > 0 %}
            {% set out.l = out.l + [ ((vals|sum)/(vals|count)/10000000) | round(3) ] %}
          {% endif %}
        {% endfor %}
        {{ out.l | join(',') }}
      attributes:
        datum: "{{ (now() + timedelta(days=1)).strftime('%d-%m-%Y') }}"
        aantal_uren: >
          {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff','forecast') or [] %}
          {% set target = (now() + timedelta(days=1)).date() %}
          {% set ns = namespace(h=[]) %}
          {% for f in fc %}
            {% set d = f.start_date | as_datetime | as_local %}
            {% if d.date() == target and d.hour not in ns.h %}
              {% set ns.h = ns.h + [d.hour] %}
            {% endif %}
          {% endfor %}
          {{ ns.h | count }}
        laatst_opgehaald: "{{ now().isoformat() }}"
